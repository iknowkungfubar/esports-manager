<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ team_name }} — eSports Manager</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0f1117; --bg-card: #1a1d27; --bg-hover: #232638; --text: #e1e4ed; --text-dim: #8b8fa3; --border: #2a2d3a; --green: #34d399; --red: #f87171; --yellow: #fbbf24; --blue: #60a5fa; --accent: #6366f1; --radius: 8px; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .back { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.5rem; display: block; }
        .sub { color: var(--text-dim); margin-bottom: 1.5rem; }
        .section { margin-bottom: 2rem; }
        .section h2 { font-size: 1rem; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: var(--radius); overflow: hidden; }
        th, td { padding: 0.65rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
        .role-badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.7rem; background: var(--bg-hover); }
        .role-badge.captain { background: rgba(99,102,241,0.2); color: #818cf8; }
        .role-badge.coach { background: rgba(52,211,153,0.2); color: var(--green); }
        .avail-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .avail-slot { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem 1rem; min-width: 120px; }
        .avail-slot .day { font-size: 0.75rem; font-weight: 600; }
        .avail-slot .time { font-size: 0.85rem; color: var(--green); }
        .avail-slot .count { font-size: 0.7rem; color: var(--text-dim); }
        a { color: var(--blue); text-decoration: none; }
        .empty { text-align: center; padding: 2rem; color: var(--text-dim); }
    </style>
</head>
<body>
    <a href="/" class="back">← Back to Dashboard</a>
    <h1>🎮 <span id="team-name">{{ team_name }}</span></h1>
    <p class="sub" id="team-meta"></p>

    <div class="section">
        <h2>Roster</h2>
        <table><thead><tr><th>Role</th><th>Player</th><th>Gamertag</th></tr></thead>
        <tbody id="roster-body"><tr><td colspan="3" class="empty">Loading...</td></tr></tbody></table>
    </div>

    <div class="section">
        <h2>Best Practice Times</h2>
        <div class="avail-grid" id="overlaps"></div>
    </div>

    <div class="section">
        <h2>Player Availability</h2>
        <div id="avail-container"><p class="empty">Loading...</p></div>
    </div>

    <script>
    async function load() {
        const name = document.getElementById('team-name').textContent;
        const res = await fetch(`/api/teams/${encodeURIComponent(name)}`);
        const data = await res.json();

        document.getElementById('team-meta').textContent = `${data.game_title} — ${data.roster.length} player(s) • ${data.description || ''}`;

        // Roster
        const rosterBody = document.getElementById('roster-body');
        if (data.roster.length === 0) {
            rosterBody.innerHTML = '<tr><td colspan="3" class="empty">No players on this team.</td></tr>';
        } else {
            rosterBody.innerHTML = data.roster.map(r => `
                <tr>
                    <td><span class="role-badge ${r.role}">${r.role}</span></td>
                    <td>${r.player_name}</td>
                    <td style="color:var(--cyan);">${r.gamertag}</td>
                </tr>
            `).join('');
        }

        // Best times
        const overlaps = document.getElementById('overlaps');
        if (data.best_times && data.best_times.length > 0) {
            overlaps.innerHTML = data.best_times.map(o => `
                <div class="avail-slot">
                    <div class="day">${o.day}</div>
                    <div class="time">${String(o.start).padStart(2,'0')}:00-${String(o.end).padStart(2,'0')}:00</div>
                    <div class="count">${o.players} available</div>
                </div>
            `).join('');
        } else {
            overlaps.innerHTML = '<p class="empty">No overlapping availability found.</p>';
        }

        // Player availability
        const availContainer = document.getElementById('avail-container');
        const availEntries = Object.entries(data.availability || {});
        if (availEntries.length === 0) {
            availContainer.innerHTML = '<p class="empty">No availability data. Players can set availability via CLI.</p>';
        } else {
            availContainer.innerHTML = '<div class="avail-grid">' +
                availEntries.map(([player, slots]) => `
                    <div class="avail-slot">
                        <div class="day">${player}</div>
                        ${slots.map(s => `<div class="time">${s.day} ${s.hours}</div>`).join('')}
                    </div>
                `).join('') +
            '</div>';
        }
    }
    load();
    </script>
</body>
</html>
